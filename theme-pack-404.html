<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Icon Not Found — No Man's Sky Theme Pack</title>
<style>
:root{
  --gold:#f0a500; --cyan:#00e5ff; --bg:#070b11; --panel:rgba(255,255,255,0.04);
  --border:rgba(255,255,255,0.09); --text:#eaf0f5; --text-dim:rgba(234,240,245,0.62);
  --text-faint:rgba(234,240,245,0.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:
  radial-gradient(circle at 20% 15%,rgba(0,229,255,.06),transparent 45%),
  radial-gradient(circle at 80% 85%,rgba(240,165,0,.06),transparent 45%),
  var(--bg);
  color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased}

.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:32px 20px;text-align:center;gap:22px}

.badge{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
  background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.3);border-radius:999px;
  padding:5px 14px}

/* A row of "icon cards" matching the real pack's grid -- one slot is
   visibly missing its art, framed as the specific icon nobody's made
   rather than a generic broken-image glyph. */
.grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:420px}
.card{width:56px;height:56px;border-radius:12px;border:1px solid var(--border);
  background:var(--panel);display:flex;align-items:center;justify-content:center;
  font-size:22px}
.card.missing{border-style:dashed;border-color:rgba(255,255,255,.18);color:var(--text-faint);
  font-size:11px;font-weight:600}

h1{font-size:clamp(20px,5vw,30px);font-weight:800;letter-spacing:-.01em;color:#fff}
.sub{max-width:440px;font-size:15px;line-height:1.65;color:var(--text-dim)}
.sub b{color:var(--text)}
.path{font-size:12px;color:var(--text-faint);font-family:ui-monospace,monospace}

.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.btn{font-size:13px;font-weight:600;text-decoration:none;color:var(--text);
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  padding:11px 20px;transition:border-color .2s,background .2s}
.btn:hover{border-color:rgba(0,229,255,.4);background:rgba(0,229,255,.05)}
.btn.primary{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.btn.primary:hover{background:#ffb61a}

.foot{padding:24px 0 12px;font-size:11px;color:var(--text-faint)}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">76 icons · this isn't one of them</div>

  <div class="grid" id="grid"></div>

  <h1>That page isn't in the pack</h1>
  <p class="sub">The link you followed doesn't match anything in the
    <b>No Man's Sky Theme Pack</b>. It may have moved, or the address was
    off by a character.</p>
  <p class="path" id="path"></p>

  <div class="actions">
    <a class="btn primary" href="/">Back to the pack</a>
    <a class="btn" href="https://nms-command-network.netlify.app">Command Network</a>
  </div>

  <div class="foot">NO MAN'S SKY THEME PACK — BUILT BY ELEGRA1965</div>
</div>

<script>
document.getElementById('path').textContent = location.pathname || '/';
(function(){
  var art = ["🛸","🖼️","⚡","🔤","📖","📲"];
  var grid = document.getElementById('grid');
  for(var i=0;i<7;i++){
    var c = document.createElement('div');
    if(i<6){ c.className='card'; c.textContent = art[i]; }
    else { c.className='card missing'; c.textContent='404'; }
    grid.appendChild(c);
  }
})();
</script>
</body>
</html>
